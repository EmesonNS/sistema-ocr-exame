services:
  test:
    build:
      context: .
      target: test
    command: pytest -q
    working_dir: /code
    environment:
      PYTHONPATH: /code
      DATABASE_URL: sqlite:///./test.db
      DB_USER: test_user
      DB_PASS: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ocr_exames_test
      REDIS_PASS: test_redis_password
      CELERY_BROKER_URL: redis://:test_redis_password@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:test_redis_password@redis:6379/0
      CACHE_REDIS_URL: redis://:test_redis_password@redis:6379/1
      GEMINI_API_KEY: test_gemini_key
      OPENROUTER_API_KEY: ""
      MASTER_API_KEY: test_master_key
      CORS_ORIGINS: '["http://localhost:5173"]'
      OCR_RETENTION_DAYS: 30
      RUN_MIGRATIONS_ON_STARTUP: "false"
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
      - ./docker-compose.prod.yml:/code/docker-compose.prod.yml:ro
      - ./amostras_exames:/code/amostras_exames:ro
      - test_uploads:/code/uploads

volumes:
  test_uploads:
