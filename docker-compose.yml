services:
  db:
    image: postgres:15-alpine
    container_name: ocr_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ocr_exames
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - ocr_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ocr_exames" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: ocr_redis
    command: redis-server --requirepass ${REDIS_PASS}
    networks:
      - ocr_network

  api:
    build: .
    container_name: ocr_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
      - ./uploads:/code/uploads
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@db:5432/ocr_exames
      CELERY_BROKER_URL: redis://:${REDIS_PASS}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASS}@redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ocr_network
      - storge_network

  worker:
    build: .
    container_name: ocr_worker
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - .:/code
      - ./uploads:/code/uploads
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@db:5432/ocr_exames
      CELERY_BROKER_URL: redis://:${REDIS_PASS}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASS}@redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - db
      - redis
    networks:
      - ocr_network

volumes:
  postgres_data:


networks:
  ocr_network:
    driver: bridge
  storge_network:
    external: true
    name: storge_app_default
