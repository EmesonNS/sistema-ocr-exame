version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ocr_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ocr_exames
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ocr_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ocr_exames" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: ocr_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASS}
    networks:
      - ocr_network
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: ocr_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    volumes:
      - ./uploads:/code/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@db:5432/ocr_exames
      CELERY_BROKER_URL: redis://:${REDIS_PASS}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASS}@redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ocr_network

  worker:
    build: .
    container_name: ocr_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info
    volumes:
      - ./uploads:/code/uploads
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@db:5432/ocr_exames
      CELERY_BROKER_URL: redis://:${REDIS_PASS}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASS}@redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ocr_network

volumes:
  postgres_data:


networks:
  ocr_network:
    driver: bridge
