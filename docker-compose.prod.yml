services:
  db:
    restart: always

  redis:
    restart: always

  migrate:
    restart: "no"

  api:
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MASTER_API_KEY: ${MASTER_API_KEY:?MASTER_API_KEY is required in prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required in prod}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required in prod}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    restart: always
    environment:
      MASTER_API_KEY: ${MASTER_API_KEY:?MASTER_API_KEY is required in prod}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required in prod}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required in prod}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
