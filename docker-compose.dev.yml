services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5433}:5432"

  migrate:
    volumes:
      - .:/code
      - ./uploads:/code/uploads

  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - .:/code
      - ./uploads:/code/uploads

  worker:
    volumes:
      - .:/code
      - ./uploads:/code/uploads
